name: BookHub CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: bookhub_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root:test@127.0.0.1:3306/bookhub_test
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # package.json already pins pnpm via the packageManager field.
      # Do not specify a second pnpm version here; pnpm/action-setup will
      # read and use the repository's packageManager declaration.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Prepare test database
        run: pnpm db:push

      - name: Tests
        run: pnpm test

      - name: Production build
        run: pnpm build
